<script>
// Máy tính / màn rộng: chỉ hiện app trong khung điện thoại ở giữa + mã QR "Mở trên điện thoại" (bản này chỉ làm cho điện thoại)
(function () {
  if (window.self !== window.top || innerWidth < 700 || /[?&]in=1\b/.test(location.search)) return;
  window.__desk = true;
  var u = new URL(location.href); u.searchParams.set("in", "1");
  var clean = location.origin + location.pathname;
  document.write('<style>html,body{margin:0;height:100%;background:radial-gradient(70% 60% at 20% 10%,rgba(123,77,255,.35),transparent 60%),radial-gradient(60% 60% at 90% 90%,rgba(255,79,163,.28),transparent 60%),#0d0a14;color:#f6f3fb;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}' +
    '.dk{height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:20px;box-sizing:border-box}' +
    '.dk iframe{width:430px;height:min(932px,calc(100vh - 40px));border:0;border-radius:40px;background:#000;box-shadow:0 0 0 10px #000,0 0 0 12px #3a3050,0 40px 90px -30px #000}' +
    '.dk .qr{text-align:center;max-width:220px}.dk .qr div{background:#fff;padding:12px;border-radius:18px;display:inline-block;margin-bottom:14px}.dk b{display:block;font-size:17px;margin-bottom:4px}.dk small{color:#a69cb8}' +
    '@media (max-width:900px){.dk .qr{display:none}}</style>' +
    '<div class="dk"><iframe src="' + u.href + '" title="VũTube.cơm" allow="autoplay; fullscreen; picture-in-picture; web-share"></iframe>' +
    '<div class="qr"><div id="qr"></div><b>Mở trên điện thoại để dùng</b><small>Quét mã bằng camera điện thoại</small></div></div>' +
    '');
  document.write('<div style="display:none">');
  var q = document.createElement("script"); q.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
  q.onload = function () { try { var g = qrcode(0, "M"); g.addData(clean); g.make(); document.getElementById("qr").innerHTML = g.createSvgTag(5, 0); } catch (e) {} };
  document.head.appendChild(q);
})();
</script>

  <button data-t="luot" class="luot"><span><svg class="i" viewBox="0 0 24 24"><rect x="6.5" y="3" width="11" height="18" rx="3"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg></span>Lướt</button>

</nav>
